
name: CI and Publish Bohr-Atom to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==================================================
  # 1. TEST: Pruebas y calidad del código
  # ==================================================

  test:
    name: Tests - Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,notebooks]"

      - name: Revisar calidad del código
        run: |
          ruff check src tests

      - name: Comprobar formato
        run: |
          ruff format --check src tests

      - name: Ejecutar pruebas
        run: |
          pytest -v --cov=bohr_atom --cov-report=term-missing


  # ==================================================
  # 2. BUILD: Construcción de las distribuciones
  # ==================================================

  build:
    name: Build Python distributions

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Instalar herramientas de construcción
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Comprobar correspondencia entre etiqueta y versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]

          expected_tag = f"v{project['version']}"
          actual_tag = os.environ["GITHUB_REF_NAME"]

          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Error: la etiqueta {actual_tag} no coincide "
                  f"con la versión del proyecto {expected_tag}."
              )

          print(f"Versión validada: {expected_tag}")
          PY

      - name: Construir Wheel y Source Distribution
        run: |
          python -m build

      - name: Validar distribuciones
        run: |
          python -m twine check dist/*

      - name: Guardar distribuciones
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1


  # ==================================================
  # 3. PUBLISH: Publicación oficial en PyPI
  # ==================================================

  publish:
    name: Publicar en PyPI

    # Ejecutar exclusivamente al enviar una etiqueta v*
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    # Requiere que test y build hayan terminado correctamente
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Descargar distribuciones
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publicar paquete en PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

