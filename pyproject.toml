[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"


[project]

name = "bohr-atom"

version = "0.1.0"

description = "Bohr atomic model calculations for hydrogen-like atoms"

readme = "README.md"

requires-python = ">=3.11"

dependencies = [
    "matplotlib>=3.8"
]


[project.optional-dependencies]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "jupyterlab>=4.0"
]


[tool.setuptools.packages.find]

where = ["src"]


[tool.pytest.ini_options]

testpaths = ["tests"]

addopts = "-ra"


[tool.ruff]

line-length = 88

target-version = "py311"


[tool.ruff.lint]

select = ["E", "F", "I", "B", "UP"]
