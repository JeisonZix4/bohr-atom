# Publica Bohr-Atom en PyPI cuando se envía una etiqueta v*.
# En pull requests y pushes a main ejecuta pruebas y construye el paquete,
# pero no publica en PyPI.

name: Publicar Bohr-Atom en PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Verifica el código en todas las versiones de Python declaradas.
  test:
    name: Pruebas con Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar el proyecto y herramientas de desarrollo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Revisar calidad del código
        run: python -m ruff check src tests

      - name: Ejecutar pruebas automatizadas
        run: python -m pytest -v

  # Construye y valida wheel y source distribution después de las pruebas.
  build:
    name: Construir distribuciones
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Evita publicar una etiqueta cuya versión no coincida con pyproject.toml.
      - name: Comprobar versión de lanzamiento
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = project["project"]["version"]
          expected_tag = f"v{package_version}"
          actual_tag = os.environ["RELEASE_TAG"]

          if actual_tag != expected_tag:
              raise SystemExit(
                  f"La etiqueta {actual_tag!r} no coincide con "
                  f"la versión {expected_tag!r} de pyproject.toml."
              )

          print(f"Versión validada: {package_version}")
          PY

      - name: Instalar herramientas de construcción
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Construir wheel y distribución fuente
        run: python -m build

      - name: Validar metadatos de las distribuciones
        run: python -m twine check dist/*

      - name: Guardar distribuciones como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Solo se ejecuta al enviar una etiqueta v* y después de construir correctamente.
  publish:
    name: Publicar en PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write

    steps:
      - name: Descargar distribuciones construidas
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publicar distribuciones en PyPI mediante Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
